<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>SQLPilot</title>
  <style>
    /* 首屏骨架：Vue 挂载前先铺住窗口，避免深色底上干等（Vue 一起就被启动画面组件接管）。
       默认跟随系统明暗，data-theme 一旦落下就以它为准——手动选过主题的用户也不会闪。 */
    #boot-veil {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #161616;
    }
    html[data-theme='light'] #boot-veil { background: #f8f8f8; }
    html[data-theme='dark'] #boot-veil { background: #161616; }
    @media (prefers-color-scheme: light) {
      html:not([data-theme]) #boot-veil { background: #f8f8f8; }
    }

    #boot-veil i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.45);
      animation: bv-pulse 1.3s ease-in-out infinite;
    }
    html[data-theme='light'] #boot-veil i {
      background: #0d0d0d;
      box-shadow: 0 0 12px 3px rgba(13, 13, 13, 0.35);
    }
    @media (prefers-color-scheme: light) {
      html:not([data-theme]) #boot-veil i {
        background: #0d0d0d;
        box-shadow: 0 0 12px 3px rgba(13, 13, 13, 0.35);
      }
    }

    @keyframes bv-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-veil" aria-hidden="true"><i></i></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
